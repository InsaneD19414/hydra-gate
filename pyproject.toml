[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-gate"
version = "0.1.0"
description = "Default-deny, fail-closed policy gate for AI-agent tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hydra Advanced Intelligence Labs" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
integration = ["fastmcp", "mcp>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
